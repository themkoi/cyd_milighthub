; PlatformIO Project Configuration File

[platformio]
default_envs = esp32

[env:esp32]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32doit-devkit-v1
framework = espidf, arduino

platform_packages = 
    framework-espidf @ https://github.com/pioarduino/esp-idf/releases/download/v5.5.2.260206/esp-idf-v5.5.2.tar.xz
    framework-arduino @ https://github.com/espressif/arduino-esp32/releases/download/3.3.7/esp32-core-3.3.7.zip
board_build.mcu = esp32
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

extra_scripts =
  pre:.build_web.py

board_build.partitions = partitions.csv

custom_component_remove = 
    espressif/esp_hosted
    espressif/esp_wifi_remote
    espressif/esp-dsp
    espressif/network_provisioning
    espressif/esp-zboss-lib
    espressif/esp-zigbee-lib
    espressif/esp_rainmaker
    espressif/rmaker_common
    espressif/esp_insights
    espressif/esp_diag_data_store
    espressif/esp_diagnostics
    espressif/cbor
    espressif/qrcode
    espressif/esp-sr
    espressif/libsodium
    espressif/esp-modbus
    chmorgan/esp-libhelix-mp3
    espressif/esp32-camera

lib_deps =
  nrf24/RF24@~1.3.2
  ArduinoJson@~6.21
  PubSubClient@~2.8
  https://github.com/ratkins/RGBConverter.git
  CircularBuffer@~1.3
  PathVariableHandlers@~3.0
  StreamUtils@~1.7
  lvgl/lvgl@^9.1.0
  h2zero/NimBLE-Arduino@^2.5.1
  bodmer/TFT_eSPI@^2.5.33
  https://github.com/themkoi/XPT2046_Touchscreen
  https://github.com/MajenkoLibraries/SoftSPI.git
  https://github.com/2Grey/s3km1110.git#ab5fb12c6e66cbcb9b3eeaa90046c7030396fb59
  arduino-libraries/NTPClient@^3.2.1
  paulstoffregen/Time@^1.6.1
  https://github.com/JChristensen/Timezone

build_flags =
  !python3 .get_version.py
  -D MQTT_MAX_PACKET_SIZE=360
  -D HTTP_UPLOAD_BUFLEN=128
  -D FIRMWARE_NAME=milight-hub
  -D RICH_HTTP_REQUEST_BUFFER_SIZE=2048
  -D RICH_HTTP_RESPONSE_BUFFER_SIZE=2048
  -D PIO_FRAMEWORK_ARDUINO_MMU_CACHE16_IRAM48
  -I dist
  -I lib/DataStructures
  -I include
  -D FIRMWARE_VARIANT=esp32
  -D LV_USE_TFT_ESPIi
  -D USE_HSPI_PORT
  -Os
  -D USER_SETUP_LOADED
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D SPI_FREQUENCY=55000000
  -D SPI_READ_FREQUENCY=20000000
  -D SPI_TOUCH_FREQUENCY=2500000
  -D LOAD_GLCD
  -D LOAD_FONT2
  -D LOAD_GFXFF
  -D SMOOTH_FONT=0
  -D ST7789_DRIVER
  -D TFT_RGB_ORDER=TFT_BGR
  -D TFT_INVERSION_OFF
  -D CORE_DEBUG_LEVEL=0
  -D CONFIG_NIMBLE_CPP_LOG_LEVEL=0

build_src_filter =
  +<*>
  -<.git/>
  -<.svn/>